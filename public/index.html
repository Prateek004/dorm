<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DormBook — Sthappit</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🏠</text></svg>" />
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🏠</div>
      <h1 class="login-title">DormBook</h1>
      <p class="login-sub">PG & Hostel Management</p>
      <form id="login-form" onsubmit="return false">
        <div class="form-group">
          <label>Email</label>
          <input id="login-email" type="email" placeholder="your@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div id="login-error" class="alert alert-error" style="display:none"></div>
        <button id="login-btn" class="btn btn-primary btn-full" onclick="App.login()">Sign In</button>
      </form>
      <!-- Demo hint removed for production -->
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell" style="display:none" class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo-mark">🏠</span>
        <span class="logo-text">DormBook</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" onclick="App.navigate('dashboard')">
          <span class="nav-icon">📊</span><span>Dashboard</span>
        </a>
        <a class="nav-item" data-page="beds" onclick="App.navigate('beds')">
          <span class="nav-icon">🛏️</span><span>Bed Map</span>
        </a>
        <a class="nav-item" data-page="residents" onclick="App.navigate('residents')">
          <span class="nav-icon">👥</span><span>Residents</span>
        </a>
        <a class="nav-item" data-page="checkin" onclick="App.navigate('checkin')">
          <span class="nav-icon">✅</span><span>Check-In</span>
        </a>
        <a class="nav-item" data-page="payments" onclick="App.navigate('payments')">
          <span class="nav-icon">💰</span><span>Payments</span>
        </a>
        <a class="nav-item nav-item--finance" data-page="finance" onclick="App.navigate('finance')">
          <span class="nav-icon">📈</span><span>Reports</span>
        </a>
        <a class="nav-item nav-item--owner" data-page="staff" onclick="App.navigate('staff')">
          <span class="nav-icon">👤</span><span>Staff</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-pill" id="user-pill">
          <span id="user-avatar" class="user-avatar">?</span>
          <span id="user-name" class="user-name">...</span>
          <span id="user-role-badge" class="role-badge">—</span>
        </div>
        <button class="btn-logout" onclick="App.logout()">Sign out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Dynamic page content injected here -->
    </main>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Global Modal -->
  <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="App.closeModal(event)">
    <div class="modal-box" id="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="App.closeModal()">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
